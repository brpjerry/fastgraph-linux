name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git github-cli rust clang pkgconf python \
            libpipewire pipewire pipewire-audio wireplumber wayland libxkbcommon \
            vulkan-icd-loader fontconfig hicolor-icon-theme

      - uses: actions/checkout@v4

      - name: Check the tag matches the package and crate versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          cargo_version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          echo "tag $version, PKGBUILD $pkgver, Cargo $cargo_version"
          test "$pkgver" = "$version"
          test "$cargo_version" = "$version"

      - name: Build the package
        run: |
          useradd -m builder
          install -d -o builder /build
          install -m644 -o builder packaging/arch/PKGBUILD /build/PKGBUILD
          cd /build
          su builder -c 'makepkg -f --noconfirm'
          version="${GITHUB_REF_NAME#v}"
          ls ./*.pkg.tar.zst
          test "$(ls ./*.pkg.tar.zst)" = "./fastgraph-${version}-1-x86_64.pkg.tar.zst"

      - name: Install the package and run it headless
        run: |
          pacman -U --noconfirm "/build/fastgraph-${GITHUB_REF_NAME#v}-1-x86_64.pkg.tar.zst"
          su builder -c 'env -u WAYLAND_DISPLAY -u DISPLAY fastgraph --version'
          test "$(su builder -c 'fastgraph --version')" = "fastgraph ${GITHUB_REF_NAME#v}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /build
          cp PKGBUILD PKGBUILD-fastgraph
          sha256sum ./*.pkg.tar.zst PKGBUILD-fastgraph > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "fastgraph ${GITHUB_REF_NAME#v}" --generate-notes \
            ./*.pkg.tar.zst PKGBUILD-fastgraph SHA256SUMS
