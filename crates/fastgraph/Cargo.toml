[package]
name = "fastgraph"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
fastgraph-core = { path = "../fastgraph-core" }
libc = "0.2"
# Wayland only: no `x11` feature.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "canvas", "thread-pool", "fira-sans", "crisp", "selector", "advanced"] }
# xdg-desktop-portal dialogs; no GTK.
rfd = "0.18"
# Export PNG: the off-screen draw (already a dependency of iced) and the encoder.
iced_runtime = "0.14"
png = "0.18"

[dev-dependencies]
iced_test = "0.14"
tempfile = "3"
